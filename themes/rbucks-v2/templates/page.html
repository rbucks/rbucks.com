{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ SITENAME }}{% endblock %}

{% block content %}
<div class="crumbs">
  <a href="{{ SITEURL }}/">Writing</a><span class="sep">/</span><span class="here">{{ page.title }}</span>
</div>

<header class="page-head">
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="sub">{{ page.subtitle }}</p>{% endif %}
</header>

<article class="about">
  {{ page.content }}
</article>
{% endblock %}
